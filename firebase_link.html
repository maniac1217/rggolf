<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Firebase 🔥 Notion 실시간 연동기</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
        #status { padding: 15px; border-radius: 5px; background-color: #e3f2fd; color: #0d47a1; font-weight: bold; margin-bottom: 10px; }
        #btn-sync { padding: 12px 24px; font-size: 16px; font-weight: bold; background-color: #4caf50; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        #btn-sync:hover { background-color: #45a049; }
        #log { margin-top: 20px; max-height: 300px; overflow-y: auto; background: white; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .info { color: #555; }
        .warn { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🔥 Firebase ➡️ Notion 실시간 전송 대시보드</h2>
    <div id="status">상태: 데이터베이스 및 Firebase 연결 준비 중...</div>
    
    <button id="btn-sync">🔄 중복 검사 후 노션에 연동하기</button>

    <h3>배달 기록창</h3>
    <div id="log">아직 들어온 데이터가 없습니다.</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==================== [초등학생 주목! 여기만 바꿔주세요] ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBwm5KpbfxaeQnyKm0MVsJH1ifyJzmnNRM",
            authDomain: "rg-golf.firebaseapp.com",
            databaseURL: "https://rg-golf-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rg-golf",
            storageBucket: "rg-golf.firebasestorage.app",
            messagingSenderId: "382686211001",
            appId: "1:382686211001:web:9c0dfba9c93b7966c9a468",
            measurementId: "G-WT14V4N0EX"
        };

        const COLLECTION_NAME = "rg-golf"; 
        
        // 2. 노션 정보 입력하기 (※ 본인의 비밀 토큰을 여기에 꼭 적어주세요!)
        const NOTION_TOKEN = "secret_이곳에_노션_토큰을_넣으세요";
        const DATABASE_ID = "390b4950c35780a690f9e911052349dd"; // 아까 찾은 진짜 ID로 수정 완료!
        // =========================================================================

        // Firebase 켜기
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const statusDiv = document.getElementById("status");
        const logDiv = document.getElementById("log");
        const syncBtn = document.getElementById("btn-sync");

        // 최신 수집된 Firebase 임시 보관 구역
        let currentFirebaseData = [];

        // -------------------------------------------------------------
        // 💾 1. IndexedDB (컴퓨터 내부 저장소) 열기 설정
        // -------------------------------------------------------------
        let idb = null;
        const dbRequest = indexedDB.open("GolfDataBackupDB", 1);

        dbRequest.onupgradeneeded = function(e) {
            let database = e.target.result;
            // 'name'을 열쇠(Key)로 사용하는 보관창고를 만듭니다
            if (!database.objectStoreNames.contains("notion_sent")) {
                database.createObjectStore("notion_sent", { keyPath: "name" });
            }
        };

        dbRequest.onsuccess = function(e) {
            idb = e.target.result;
            statusDiv.innerText = "상태: 👀 IndexedDB 연결 완료! Firebase 감시 시작...";
            startFirebaseListening();
        };

        dbRequest.onerror = function() {
            statusDiv.innerText = "상태: ❌ IndexedDB 연결 실패!";
        };

        // IndexedDB에 데이터를 기억(저장)시키는 함수
        function saveToIndexedDB(name, content) {
            if (!idb) return;
            const transaction = idb.transaction(["notion_sent"], "readwrite");
            const store = transaction.objectStore("notion_sent");
            store.put({ name: name, content: content, savedAt: new Date().getTime() });
        }

        // IndexedDB에 이미 이 이름이 있는지 검사하는 함수
        function checkIsDuplicate(name) {
            return new Promise((resolve) => {
                if (!idb) return resolve(false);
                const transaction = idb.transaction(["notion_sent"], "readonly");
                const store = transaction.objectStore("notion_sent");
                const request = store.get(name);
                
                request.onsuccess = function(e) {
                    if (e.target.result) {
                        resolve(true); // 이미 존재함 (중복)
                    } else {
                        resolve(false); // 존재하지 않음 (새로운 자료)
                    }
                };
                request.onerror = function() { resolve(false); };
            });
        }

        // -------------------------------------------------------------
        // 🔥 2. Firebase 실시간 감시 엔진
        // -------------------------------------------------------------
        function startFirebaseListening() {
            onSnapshot(collection(db, COLLECTION_NAME), (snapshot) => {
                currentFirebaseData = []; // 리스트 초기화
                
                snapshot.forEach((doc) => {
                    const docData = doc.data();
                    const name = docData.name || "이름 없음";
                    const content = docData.content || "내용 없음";
                    
                    // 현재 파이어베이스에 있는 모든 데이터를 프로그램 기억창고에 모아둡니다
                    currentFirebaseData.push({ name, content });
                });
                
                printLog(`<span class="info">ℹ️ Firebase로부터 총 ${currentFirebaseData.length}개의 데이터를 실시간 감지해 대기 중입니다.</span>`);
            });
        }

        // -------------------------------------------------------------
        // 🔄 3. 연동 버튼 클릭 시 작동하는 중복 방지 로직
        // -------------------------------------------------------------
        syncBtn.addEventListener("click", async () => {
            if (currentFirebaseData.length === 0) {
                alert("연동할 Firebase 데이터가 아직 없습니다!");
                return;
            }

            syncBtn.disabled = true;
            syncBtn.innerText = "⏳ 중복 검사 및 전송 중...";
            printLog(`<b>🔄 [연동 시작] 중복 검사를 진행합니다...</b>`);

            let sendCount = 0;
            let skipCount = 0;

            for (const item of currentFirebaseData) {
                // IndexedDB에 이미 이름이 있는지 확인해봅니다
                const isDuplicate = await checkIsDuplicate(item.name);

                if (isDuplicate) {
                    // 중복된 경우 패스!
                    printLog(`<span class="info">⏭️ 중복 패스: [${item.name}]은 이미 저장소에 보관되어 있어 제외합니다.</span>`);
                    skipCount++;
                } else {
                    // 중복이 아니면 노션으로 쏘기!
                    printLog(`🚀 새 자료 발견! 노션으로 전송 시도 -> <b>${item.name}</b>`);
                    
                    const success = await sendToNotion(item.name, item.content);
                    if (success) {
                        // 성공적으로 노션에 갔다면, 다음엔 중복처리되도록 IndexedDB에 저장!
                        saveToIndexedDB(item.name, item.content);
                        sendCount++;
                    }
                }
            }

            printLog(`<b class="success">🏁 연동 완료! (새로 보낸 자료: ${sendCount}개 / 중복 제외: ${skipCount}개)</b>`);
            syncBtn.disabled = false;
            syncBtn.innerText = "🔄 중복 검사 후 노션에 연동하기";
        });

        // -------------------------------------------------------------
        // ✉️ 4. 노션 API 전송 팩토리
        // -------------------------------------------------------------
        async function sendToNotion(name, content) {
            const proxyUrl = "https://cors-anywhere.herokuapp.com/";
            const notionUrl = "https://api.notion.com/v1/pages";

            const payload = {
                parent: { database_id: DATABASE_ID },
                properties: {
                    "Name": { title: [{ text: { content: name } }] },
                    "Content": { rich_text: [{ text: { content: content } }] }
                }
            };

            try {
                const response = await fetch(proxyUrl + notionUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${NOTION_TOKEN}`,
                        "Content-Type": "application/json",
                        "Notion-Version": "2022-06-28"
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    printLog(`<span class="success">✅ 노션 표에 배달 완료: ${name}</span>`);
                    return true;
                } else {
                    const errText = await response.text();
                    printLog(`<span class="warn">❌ 노션 배달 실패 [${name}]: ${errText}</span>`);
                    return false;
                }
            } catch (error) {
                printLog(`<span class="warn">❌ 연결 오류 (cors-anywhere 활성화를 확인하세요)</span>`);
                return false;
            }
        }

        // 화면 기록기
        function printLog(message) {
            logDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
    </script>
</body>
</html>
