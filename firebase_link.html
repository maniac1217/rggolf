<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Firebase 🔥 Airtable 강제 연동기 (완벽 매칭 판)</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
        #status { padding: 15px; border-radius: 5px; background-color: #e3f2fd; color: #0d47a1; font-weight: bold; margin-bottom: 10px; }
        #btn-sync { padding: 12px 24px; font-size: 16px; font-weight: bold; background-color: #e91e63; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        #btn-sync:hover { background-color: #c2185b; }
        #log { margin-top: 20px; max-height: 300px; overflow-y: auto; background: white; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; font-weight: bold; }
        .fb-success { color: #ff5722; font-weight: bold; }
        .info { color: #757575; }
        .warn { color: #f44336; font-weight: bold; background-color: #ffebee; padding: 2px 5px; border-radius: 3px; }
    </style>
</head>
<body>

    <h2>🔥 대시보드: 수동 입력 자료 Firebase 강제 전송 시스템 (Airtable 탑재)</h2>
    <div id="status">상태: RG_Golf_DB 데이터베이스 연결 중...</div>
    
    <button id="btn-sync">🚀 RG_Golf_DB 자료 Firebase 무조건 강제 전송</button>

    <div style="margin-top: 30px; margin-bottom: 30px; background: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 8px;">
        <h3 style="margin-top:0; color: #333;">📦 브라우저 창고(IndexedDB) 저장 데이터 실시간 조회</h3>
        <button id="btn-view-db" style="padding: 8px 16px; background-color: #008cba; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
            🔍 창고 데이터 전부 펼쳐보기
        </button>
        
        <div style="margin-top: 15px; overflow-x: auto;">
            <table border="1" style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
                <thead>
                    <tr style="background-color: #f2f2f2;">
                        <th style="padding: 10px;">이름 (Key)</th>
                        <th style="padding: 10px;">내용 (상세 데이터)</th>
                        <th style="padding: 10px;">관리</th>
                    </tr>
                </thead>
                <tbody id="db-list-tbody">
                    <tr>
                        <td colspan="3" style="padding: 15px; text-align: center; color: #999;">창고 연결 후 자동으로 로컬 데이터가 로드됩니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div style="margin-top: 15px; padding: 15px; background-color: #f9f9f9; border: 1px dashed #ccc; border-radius: 6px;">
        <p style="margin: 0 0 10px 0; font-size: 14px; font-weight: bold; color: #555;">📥 구글시트 장부 데이터를 다시 프로그램으로 올리기</p>
        <input type="text" id="input-sheet-url" placeholder="https://docs.google.com/spreadsheets/d/... 주소를 통째로 붙여넣으세요" style="width: 70%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;">
        <button id="btn-import-sheet" style="padding: 8px 16px; background-color: #e67e22; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 5px;">
            🔄 자료 덮어쓰기 복원
        </button>
    </div>

    <div style="margin-top: 15px;">
        <button id="btn-google-open" style="padding: 8px 16px; background-color: #4285F4; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
            🌐 구글시트로 즉시 자동 오픈하기
        </button>    
    </div>

    <h3>배달 작업 기록창</h3>
    <div id="log">아직 진행된 작업이 없습니다.</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // ==================== [설정값 세팅] ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBwm5KpbfxaeQnyKm0MVsJH1ifyJzmnNRM",
            authDomain: "rg-golf.firebaseapp.com",
            databaseURL: "https://rg-golf-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rg-golf",
            storageBucket: "rg-golf.firebasestorage.app",
            messagingSenderId: "382686211001",
            appId: "1:382686211001:web:9c0dfba9c93b7966c9a468",
            measurementId: "G-WT14V4N0EX"
        };

        // ⚠️ 1단계에서 획득한 용섭님의 진짜 에어테이블 웹훅 주소를 아래 따옴표 안에 넣어주세요!
        const airtableWebhookUrl = "https://hooks.airtable.com/workflows/v1/generic/여기에_에어테이블_웹훅_주소를_넣으세요";
        const googleScriptUrl = "https://script.google.com/macros/s/AKfycbyBmq3ePMStEDy9pKiJELdXLnG0ulYwUBsNHFNUAwDODSQQphOnhzaBo1meUSqhpiKEYg/exec";
        // =====================================================

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const statusDiv = document.getElementById("status");
        const logDiv = document.getElementById("log");
        const syncBtn = document.getElementById("btn-sync");

        let idb = null;

        // 🌟 [안전장치 1] 에러 방지를 위해 리스트 출력 함수를 최상단에 깨끗하게 정의합니다.
        function viewIndexedDBData() {
            const tbody = document.getElementById("db-list-tbody");
            if (!idb) return;

            try {
                const transaction = idb.transaction(["reservations"], "readonly");
                const store = transaction.objectStore("reservations");
                const request = store.getAll(); 

                request.onsuccess = function(e) {
                    const items = e.target.result || [];
                    tbody.innerHTML = ""; 

                    if (items.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="3" style="padding:15px; text-align:center; color:red;">현재 브라우저 창고에 저장된 데이터가 0개입니다.</td></tr>`;
                        return;
                    }

                    items.forEach(item => {
                        const tr = document.createElement("tr");
                        let currentName = item.name || (item.content && item.content.name) || "무명자료";
                        
                        let displayContent = "";
                        let c = (item.content && typeof item.content === 'object') ? item.content : item;
                        
                        displayContent = `📞연락처: ${c.phone || item.phone || '-'} | 👥인원: ${c.count || item.count || '-'} | ⏰시간: ${c.time || item.time || '-'} | 💳상태: ${c.status || item.status || '-'}`;

                        const tdName = document.createElement("td");
                        tdName.style.padding = "10px"; tdName.style.fontWeight = "bold";
                        tdName.innerText = currentName;

                        const tdContent = document.createElement("td");
                        tdContent.style.padding = "10px"; tdContent.style.color = "#333";
                        tdContent.innerText = displayContent;

                        const tdAction = document.createElement("td");
                        tdAction.style.padding = "10px"; tdAction.style.textAlign = "center";
                        
                        const delBtn = document.createElement("button");
                        delBtn.innerText = "삭제";
                        delBtn.style.cssText = "padding:4px 8px; background-color:#f44336; color:white; border:none; border-radius:3px; cursor:pointer; font-size:12px;";
                        delBtn.onclick = function() {
                            if (confirm(`[${currentName}] 데이터를 삭제하시겠습니까?`)) {
                                idb.transaction(["reservations"], "readwrite").objectStore("reservations").delete(item.name).onsuccess = function() {
                                    alert("삭제 완료되었습니다.");
                                    viewIndexedDBData();
                                    checkDatabaseCount();
                                };
                            }
                        };
                        tdAction.appendChild(delBtn);

                        tr.appendChild(tdName);
                        tr.appendChild(tdContent);
                        tr.appendChild(tdAction);
                        tbody.appendChild(tr);
                    });
                };
            } catch (err) {
                console.error("화면 표시 중 에러:", err);
            }
        }

        // DB 연결 시작
        const dbRequest = indexedDB.open("RG_Golf_DB");

        dbRequest.onupgradeneeded = function(e) {
            let database = e.target.result;
            if (!database.objectStoreNames.contains("reservations")) {
                database.createObjectStore("reservations", { keyPath: "name" });
            }
            if (!database.objectStoreNames.contains("notion_sent")) {
                database.createObjectStore("notion_sent", { keyPath: "name" });
            }
        };

        dbRequest.onsuccess = function(e) {
            idb = e.target.result;
            setTimeout(() => { 
                checkDatabaseCount(); 
                viewIndexedDBData(); // 🌟 창고 열리면 즉시 화면에 자동 로드하도록 변경
            }, 200);
        };

        dbRequest.onerror = function() {
            statusDiv.innerText = "상태: ❌ 실제 RG_Golf_DB 보관함을 열지 못했습니다.";
        };

        function checkDatabaseCount() {
            if (!idb) return;
            if (!idb.objectStoreNames.contains("reservations")) {
                statusDiv.innerHTML = `상태: ⚠️ 창고가 존재하지 않습니다.`;
                return;
            }
            try {
                const transaction = idb.transaction(["reservations"], "readonly");
                const store = transaction.objectStore("reservations");
                const countRequest = store.count();
                countRequest.onsuccess = function() {
                    statusDiv.innerHTML = `상태: 🟢 <b>RG_Golf_DB [reservations]</b> 연결 성공! (현재 대기 자료: <span style="color:red; font-size:18px;">${countRequest.result}</span>개)`;
                };
            } catch (err) {
                console.error(err);
            }
        }

        // 버튼 클릭 이벤트 바인딩
        document.getElementById("btn-view-db").addEventListener("click", viewIndexedDBData);

        // 🌐 구글 시트로 내보내기 및 자동 오픈 기능
        async function exportAndOpenGoogleSheet() {
            if (!idb) return alert("데이터베이스가 연결되지 않았습니다.");
            try {
                const transaction = idb.transaction(["reservations"], "readonly");
                const store = transaction.objectStore("reservations");
                const request = store.getAll();

                request.onsuccess = function(e) {
                    const items = e.target.result || [];
                    if (items.length === 0) return alert("보낼 데이터가 없습니다.");

                    const parsedRows = items.map(item => {
                        let name = item.name || "", phone = item.phone || "", count = item.count || "", time = item.time || "", status = item.status || "", createdAt = item.createdAt || "", id = item.id || "";
                        if (item.content && typeof item.content === 'object') {
                            name = item.content.name || name; phone = item.content.phone || phone; count = item.content.count || count; time = item.content.time || time; status = item.content.status || status; createdAt = item.content.createdAt || createdAt;
                        }
                        return { name, phone, count, time, status, createdAt, id };
                    });

                    const openBtn = document.getElementById("btn-google-open");
                    openBtn.innerText = "⏳ 구글 시트 생성 및 이동 중...";
                    openBtn.disabled = true;

                    fetch(googleScriptUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "createGoogleSheet", csvData: parsedRows })
                    })
                    .then(res => res.json())
                    .then(resultJson => {
                        if (resultJson.success && resultJson.sheetUrl) {
                            printLog(`<span class="success">✅ 구글 드라이브에 시트 생성 완료! 새 창을 엽니다.</span>`);
                            window.open(resultJson.sheetUrl, "_blank");
                        } else {
                            alert("구글 시트 생성 실패: " + JSON.stringify(resultJson));
                        }
                    })
                    .catch(err => alert("전송 에러: " + err.message))
                    .finally(() => {
                        openBtn.innerText = "🌐 구글시트로 즉시 자동 오픈하기";
                        openBtn.disabled = false;
                    });
                };
            } catch (err) { alert("창고 접근 실패: " + err.message); }
        }
        document.getElementById("btn-google-open").addEventListener("click", exportAndOpenGoogleSheet);

        // 📥 구글 시트 데이터 프로그램으로 재복원 기능 (필드 매칭 전폭 강화형)
        async function importGoogleSheetToProgram() {
            const sheetUrl = document.getElementById("input-sheet-url").value.trim();
            if (!sheetUrl) return alert("구글 스프레드시트의 전체 주소(URL)를 입력해주세요.");
            if (!idb) return alert("데이터베이스 창고 연결을 확인할 수 없습니다.");

            if (!confirm("주의! 구글 시트 데이터로 브라우저 창고(IndexedDB)에 강제 덮어쓰기를 진행하시겠습니까?")) return;

            const importBtn = document.getElementById("btn-import-sheet");
            try {
                importBtn.innerText = "⏳ 구글 시트 분석 및 강제 주입 중...";
                importBtn.disabled = true;

                const response = await fetch(googleScriptUrl, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "importFromGoogleSheet", sheetUrl: sheetUrl })
                });

                const resultJson = JSON.parse(await response.text());
                if (!resultJson.success || !resultJson.data) {
                    throw new Error(resultJson.message || "구글 시트 데이터를 읽지 못했습니다.");
                }

                const rows = resultJson.data;
                const transaction = idb.transaction(["reservations"], "readwrite");
                const store = transaction.objectStore("reservations");

                let importCount = 0;

                rows.forEach(row => {
                    let finalName = row.name || row.Name || row["이름"] || row.id || "무명예약자";
                    let finalPhone = row.phone || row.Phone || row["연락처"] || row["전화번호"] || "-";
                    let finalCount = row.count || row.Count || row["인원"] || row["인원수"] || "-";
                    let finalTime = row.time || row.Time || row["시간"] || row["예약시간"] || "-";
                    let finalStatus = row.status || row.Status || row["상태"] || row["결제상태"] || "-";
                    let finalCreatedAt = row.createdAt || row.CreatedAt || row["등록일"] || new Date().toISOString();
                    let finalId = row.id || row.Id || row["아이디"] || "ID_" + Math.floor(Math.random() * 100000);

                    finalName = String(finalName).trim();

                    if (finalName) {
                        store.put({
                            name: finalName,
                            phone: finalPhone,
                            count: finalCount,
                            time: finalTime,
                            status: finalStatus,
                            createdAt: finalCreatedAt,
                            id: finalId,
                            content: { name: finalName, phone: finalPhone, count: finalCount, time: finalTime, status: finalStatus, createdAt: finalCreatedAt }
                        });
                        importCount++;
                    }
                });

                transaction.oncomplete = function() {
                    alert(`🎉 복원 완수! 구글 시트로부터 총 [${importCount}개]의 예약을 가져와 브라우저 창고에 완벽 이식했습니다.`);
                    document.getElementById("input-sheet-url").value = "";
                    viewIndexedDBData();
                    checkDatabaseCount();
                };
            } catch (err) {
                alert("구글 시트 가져오기 실패: " + err.message);
            } finally {
                importBtn.innerText = "🔄 자료 덮어쓰기 복원";
                importBtn.disabled = false;
            }
        }
        document.getElementById("btn-import-sheet").addEventListener("click", importGoogleSheetToProgram);

        // 창고 기록용 편의 함수들
        function saveToNotionSentHistory(name) {
            try {
                idb.transaction(["notion_sent"], "readwrite").objectStore("notion_sent").put({ name: name, sentAt: new Date().getTime() });
            } catch (e) { console.log(e); }
        }

        function checkNotionHistory(name) {
            return new Promise((resolve) => {
                try {
                    const request = idb.transaction(["notion_sent"], "readonly").objectStore("notion_sent").get(name);
                    request.onsuccess = function(e) { resolve(!!e.target.result); };
                    request.onerror = function() { resolve(false); };
                } catch { resolve(false); }
            });
        }

        function getAllItemsFromIndexedDB() {
            return new Promise((resolve) => {
                try {
                    const request = idb.transaction(["reservations"], "readonly").objectStore("reservations").getAll();
                    request.onsuccess = function(e) { resolve(e.target.result || []); };
                    request.onerror = function() { resolve([]); };
                } catch (err) { resolve([]); }
            });
        }

        // Firebase 데이터 전송
        async function forceSendToFirebase(rawName, rawContent) {
            let cleanName = rawName ? String(rawName).trim() : "";
            let cleanContent = typeof rawContent === 'object' ? JSON.stringify(rawContent) : String(rawContent).trim();
            if (cleanName === "") cleanName = "수동입력_무명자료_" + Math.floor(Math.random() * 10000);
            if (cleanName.includes("/")) cleanName = cleanName.replace(/\//g, "_");

            try {
                const dbRef = ref(db, 'reservations/' + cleanName);
                await set(dbRef, { name: cleanName, content: cleanContent, forcedSync: true, updatedAt: new Date().toISOString() });
                printLog(`<span class="fb-success">🚀 [Firebase 강제성공] 문서명: ${cleanName}</span>`);
                return { success: true, name: cleanName, content: cleanContent };
            } catch (error) {
                printLog(`<span class="warn">❌ [Firebase 강제실패] 원인: ${error.message}</span>`);
                return { success: false, name: cleanName, content: cleanContent };
            }
        }

        // 🚀 [노션 대안] 에어테이블 웹훅으로 바로 전달하는 튼튼한 함수
        async function sendToAirtable(name, content) {
            if (!airtableWebhookUrl || airtableWebhookUrl.includes("여기에_에어테이블")) {
                printLog(`<span class="warn">❌ [Airtable] 웹훅 주소가 아직 기본값입니다. 코딩 상단에서 주소를 교체해 주세요.</span>`);
                return false;
            }

            const payload = {
                name: name,
                content: typeof content === 'object' ? JSON.stringify(content) : String(content)
            };

            try {
                const response = await fetch(airtableWebhookUrl, {
                    method: "POST",
                    headers: { "Content-Type": "text/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    printLog(`<span class="success">✅ [Airtable] 실시간 대시보드 반영 성공: ${name}</span>`);
                    return true;
                } else {
                    printLog(`<span class="warn">❌ [Airtable] 전송 에러 발생 (코드: ${response.status})</span>`);
                    return false;
                }
            } catch (error) {
                printLog(`<span class="warn">❌ [Airtable] 네트워크 연결 실패: ${error.message}</span>`);
                return false;
            }
        }

        // 메인 실행 버튼 이벤트 리스너
        syncBtn.addEventListener("click", async () => {
            syncBtn.disabled = true;
            syncBtn.innerText = "⏳ 데이터 전송 진행 중...";
            printLog(`<b>🔄 작업을 시작합니다. 데이터 수집 중...</b>`);

            const localItems = await getAllItemsFromIndexedDB();
            if (localItems.length === 0) {
                alert("전송할 데이터가 0개입니다!");
                syncBtn.disabled = false;
                syncBtn.innerText = "🚀 RG_Golf_DB 자료 Firebase 무조건 강제 전송";
                return;
            }

            let fbCount = 0; let airtableCount = 0;
            for (const item of localItems) {
                const targetName = item.name || "무명자료";
                const targetContent = item.content || "내용없음";

                // 1. 파이어베이스 강제 전송
                const fbResult = await forceSendToFirebase(targetName, targetContent);
                if (fbResult.success) {
                    fbCount++;
                    // 2. 에어테이블 중복 전송 방지 체크 후 발송
                    const isAlreadySent = await checkNotionHistory(fbResult.name);
                    if (!isAlreadySent) {
                        const airtableSuccess = await sendToAirtable(fbResult.name, fbResult.content);
                        if (airtableSuccess) { 
                            saveToNotionSentHistory(fbResult.name); 
                            airtableCount++; 
                        }
                    }
                }
            }
            printLog(`<b class="success">🏁 전송 완료! (파이어베이스: ${fbCount}개 / Airtable 신규: ${airtableCount}개)</b>`);
            syncBtn.disabled = false; 
            syncBtn.innerText = "🚀 RG_Golf_DB 자료 Firebase 무조건 강제 전송";
            checkDatabaseCount();
            viewIndexedDBData();
        });

        function printLog(message) {
            logDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
    </script>
</body>
</html>
