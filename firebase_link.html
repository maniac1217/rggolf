<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Firebase 🔥 Notion 동시 연동기</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
        #status { padding: 15px; border-radius: 5px; background-color: #e3f2fd; color: #0d47a1; font-weight: bold; margin-bottom: 10px; }
        #btn-sync { padding: 12px 24px; font-size: 16px; font-weight: bold; background-color: #ff5722; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
        #btn-sync:hover { background-color: #e64a19; }
        #log { margin-top: 20px; max-height: 300px; overflow-y: auto; background: white; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; font-weight: bold; }
        .fb-success { color: #0288d1; }
        .info { color: #555; }
        .warn { color: #f44336; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🔥 대시보드: 중복 검사 후 Firebase & Notion 동시 전송</h2>
    <div id="status">상태: 데이터베이스 연결 준비 중...</div>
    
    <button id="btn-sync">🔄 신규 자료 Firebase & 노션 동시 반영하기</button>

    <h3>배달 작업 기록창</h3>
    <div id="log">아직 진행된 작업이 없습니다.</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==================== [초등학생 주목! 여기만 확인하세요] ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBwm5KpbfxaeQnyKm0MVsJH1ifyJzmnNRM",
            authDomain: "rg-golf.firebaseapp.com",
            databaseURL: "https://rg-golf-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "rg-golf",
            storageBucket: "rg-golf.firebasestorage.app",
            messagingSenderId: "382686211001",
            appId: "1:382686211001:web:9c0dfba9c93b7966c9a468",
            measurementId: "G-WT14V4N0EX"
        };

        const COLLECTION_NAME = "rg-golf"; 
        
        // 노션 정보 (※ 본인의 비밀 토큰을 여기에 꼭 적어주세요!)
        const NOTION_TOKEN = "secret_이곳에_노션_토큰을_넣으세요";
        const DATABASE_ID = "390b4950c35780a690f9e911052349dd"; 
        // =========================================================================

        // Firebase 켜기
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const statusDiv = document.getElementById("status");
        const logDiv = document.getElementById("log");
        const syncBtn = document.getElementById("btn-sync");

        // -------------------------------------------------------------
        // 💾 1. IndexedDB (내 컴퓨터 보관함) 열기
        // -------------------------------------------------------------
        let idb = null;
        const dbRequest = indexedDB.open("GolfDataBackupDB", 1);

        dbRequest.onupgradeneeded = function(e) {
            let database = e.target.result;
            // 'name'을 열쇠로 쓰고, 노션과 파이어베이스에 이미 보낸 대상을 기억할 창고
            if (!database.objectStoreNames.contains("notion_sent")) {
                database.createObjectStore("notion_sent", { keyPath: "name" });
            }
        };

        dbRequest.onsuccess = function(e) {
            idb = e.target.result;
            statusDiv.innerText = "상태: 🟢 준비 완료! 버튼을 누르면 중복 검사를 시작합니다.";
        };

        dbRequest.onerror = function() {
            statusDiv.innerText = "상태: ❌ 내 컴퓨터 보관함(IndexedDB)을 열지 못했습니다.";
        };

        // IndexedDB에 성공한 데이터를 기억시키는 함수
        function saveToIndexedDB(name, content) {
            if (!idb) return;
            const transaction = idb.transaction(["notion_sent"], "readwrite");
            const store = transaction.objectStore("notion_sent");
            store.put({ name: name, content: content, savedAt: new Date().getTime() });
        }

        // IndexedDB에서 모든 임시 자료들을 꺼내오는 함수
        function getAllItemsFromIndexedDB() {
            return new Promise((resolve) => {
                if (!idb) return resolve([]);
                const transaction = idb.transaction(["notion_sent"], "readonly");
                const store = transaction.objectStore("notion_sent");
                const request = store.getAll(); // 보관함 안의 모든 데이터 가져오기
                
                request.onsuccess = function(e) {
                    resolve(e.target.result || []);
                };
                request.onerror = function() { resolve([]); };
            });
        }

        // -------------------------------------------------------------
        // 🔥 2. Firebase에 즉각 반영(저장)하는 함수
        // -------------------------------------------------------------
        async function sendToFirebase(name, content) {
            try {
                // 이름(name)을 문서 아이디로 지정하여 중복 생성을 방지하며 저장합니다
                const docRef = doc(db, COLLECTION_NAME, name);
                await setDoc(docRef, {
                    name: name,
                    content: content,
                    updatedAt: new Date().toISOString()
                });
                printLog(`<span class="fb-success">🔥 [Firebase] 즉각 반영 성공: ${name}</span>`);
                return true;
            } catch (error) {
                printLog(`<span class="warn">❌ [Firebase] 반영 실패: ${error.message}</span>`);
                return false;
            }
        }

        // -------------------------------------------------------------
        // ✉️ 3. Notion에 반영(저장)하는 함수
        // -------------------------------------------------------------
        async function sendToNotion(name, content) {
            const proxyUrl = "https://cors-anywhere.herokuapp.com/";
            const notionUrl = "https://api.notion.com/v1/pages";

            const payload = {
                parent: { database_id: DATABASE_ID },
                properties: {
                    "Name": { title: [{ text: { content: name } }] },
                    "Content": { rich_text: [{ text: { content: content } }] }
                }
            };

            try {
                const response = await fetch(proxyUrl + notionUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${NOTION_TOKEN}`,
                        "Content-Type": "application/json",
                        "Notion-Version": "2022-06-28"
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    printLog(`<span class="success">✅ [Notion] 표에 반영 완료: ${name}</span>`);
                    return true;
                } else {
                    const errText = await response.text();
                    printLog(`<span class="warn">❌ [Notion] 반영 실패 [${name}]: ${errText}</span>`);
                    return false;
                }
            } catch (error) {
                printLog(`<span class="warn">❌ 연결 오류 (cors-anywhere 활성화를 확인하세요)</span>`);
                return false;
            }
        }

        // -------------------------------------------------------------
        // 🔄 4. [연동 버튼] 클릭 시 실행되는 핵심 로직
        // -------------------------------------------------------------
        syncBtn.addEventListener("click", async () => {
            syncBtn.disabled = true;
            syncBtn.innerText = "⏳ 중복 검사 및 동시 전송 중...";
            printLog(`<b>🔄 작업을 시작합니다. 컴퓨터 보관함(IndexedDB)을 확인하는 중...</b>`);

            // 1) 내 컴퓨터 보관함(IndexedDB)에 쌓여있는 자료를 전부 긁어옵니다.
            // (※ 만약 다른 입력창에서 IndexedDB에 데이터를 미리 쌓아두고 있다고 가정합니다.)
            const localItems = await getAllItemsFromIndexedDB();

            if (localItems.length === 0) {
                alert("보관함(IndexedDB)에 연동할 데이터가 없습니다! 먼저 데이터를 추가해주세요.");
                syncBtn.disabled = false;
                syncBtn.innerText = "🔄 신규 자료 Firebase & 노션 동시 반영하기";
                return;
            }

            let syncCount = 0;

            for (const item of localItems) {
                printLog(`-----------------------------------------------`);
                printLog(`🔍 검사 중: [${item.name}] 처리 시작`);

                // 2) Firebase에 즉시 반영 시도!
                const firebaseSuccess = await sendToFirebase(item.name, item.content);
                
                // 3) 노션에도 즉시 반영 시도!
                const notionSuccess = await sendToNotion(item.name, item.content);

                if (firebaseSuccess && notionSuccess) {
                    syncCount++;
                }
            }

            printLog(`-----------------------------------------------`);
            printLog(`<b class="success">🏁 모든 작업 완료! 총 ${syncCount}개의 자료가 Firebase와 Notion에 동시 반영되었습니다.</b>`);
            syncBtn.disabled = false;
            syncBtn.innerText = "🔄 신규 자료 Firebase & 노션 동시 반영하기";
        });

        // 화면 기록기 함수
        function printLog(message) {
            logDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }
    </script>
</body>
</html>
