<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>구글 시트 데이터 연동 관리자 도구</title>
    <style>
        body { font-family: 'Apple SD Gothic Neo', Arial, sans-serif; padding: 20px; background-color: #f9f9f9; }
        #status { padding: 15px; border-radius: 5px; background-color: #e3f2fd; color: #0d47a1; font-weight: bold; margin-bottom: 20px; }
        .btn-action { padding: 10px 20px; font-size: 15px; font-weight: bold; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn-view { background-color: #008cba; }
        .btn-import { background-color: #e67e22; }
        .btn-export { background-color: #4285F4; }
        .btn-back { background-color: #7f8c8d; text-decoration: none; display: inline-block; text-align: center; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .box-container { margin-bottom: 25px; background: #fff; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; margin-top: 10px; }
        th, td { padding: 10px; border: 1px solid #ccc; }
        th { background-color: #f2f2f2; }
        
        .flex-inputs { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2>📊 알지골프 - 구글 시트 데이터 동기화 시스템</h2>
    <div id="status">상태: RG_Golf_DB 데이터베이스 연결 중...</div>
    
    <div class="box-container">
        <h3 style="margin-top:0; color: #333;">📦 브라우저 창고(IndexedDB) 저장 데이터 실시간 조회</h3>
        <button id="btn-view-db" class="btn-action btn-view">🔍 창고 데이터 전부 펼쳐보기</button>
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>이름 (예약자명)</th>
                        <th>내용 (상세 데이터)</th>
                        <th style="width: 80px; text-align: center;">관리</th>
                    </tr>
                </thead>
                <tbody id="db-list-tbody">
                    <tr>
                        <td colspan="3" style="padding: 15px; text-align: center; color: #999;">창고 연결 후 자동으로 로컬 데이터가 로드됩니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="box-container">
        <h3 style="margin-top:0; color: #333;">📥 구글시트 장부 데이터를 가져와서 로컬창고 복원</h3>
        <p style="margin: 0; font-size: 13px; color: #666;">※ 복원 시작 시 브라우저 내의 기존 데이터는 초기화되고 구글 시트 내용으로 대체됩니다.</p>
        <div class="flex-inputs">
            <input type="text" id="input-sheet-url" placeholder="https://docs.google.com/spreadsheets/d/... 주소를 통째로 붙여넣으세요">
            <button id="btn-import-sheet" class="btn-action btn-import">🔄 자료 구조 검증 후 복원</button>
        </div>
    </div>

    <div class="box-container" style="display: flex; gap: 10px;">
        <button id="btn-google-open" class="btn-action btn-export">🌐 구글시트로 표준 규격 내보내기</button> 
        <a href="admin.html" class="btn-action btn-back" style="line-height: 23px;">⬅ 관리자 화면으로 돌아가기</a>
    </div>

    <script type="module">
        // Google Apps Script 웹 앱 URL (기존 제공 주소 유지)
        const googleScriptUrl = "https://script.google.com/macros/s/AKfycbyBmq3ePMStEDy9pKiJELdXLnG0ulYwUBsNHFNUAwDODSQQphOnhzaBo1meUSqhpiKEYg/exec";

        const statusDiv = document.getElementById("status");
        const tbody = document.getElementById("db-list-tbody");
        let idb = null;

        // 📦 IndexedDB 초기화 및 커넥션 연결
        const dbRequest = indexedDB.open("RG_Golf_DB");
        dbRequest.onupgradeneeded = function(e) {
            let database = e.target.result;
            if (!database.objectStoreNames.contains("reservations")) {
                database.createObjectStore("reservations", { keyPath: "id" });
            }
        };
        dbRequest.onsuccess = function(e) {
            idb = e.target.result;
            setTimeout(() => { checkDatabaseCount(); viewIndexedDBData(); }, 200);
        };
        dbRequest.onerror = function() {
            statusDiv.innerHTML = "상태: ❌ 실제 RG_Golf_DB 보관함을 열지 못했습니다.";
        };

        // 로컬 창고 데이터 개수 확인 표시
        function checkDatabaseCount() {
            if (!idb) return;
            try {
                const transaction = idb.transaction(["reservations"], "readonly");
                const store = transaction.objectStore("reservations");
                const countRequest = store.count();
                countRequest.onsuccess = function() {
                    statusDiv.innerHTML = `상태: 🟢 <b>RG_Golf_DB [reservations]</b> 연결 성공! (현재 창고 자료: <span style="color:red; font-size:16px;">${countRequest.result}</span>개)`;
                };
            } catch (err) { console.error(err); }
        }

        // 창고 데이터 테이블 렌더링 함수
        function viewIndexedDBData() {
            if (!idb) return;
            try {
                const transaction = idb.transaction(["reservations"], "readonly");
                const store = transaction.objectStore("reservations");
                const request = store.getAll(); 
                request.onsuccess = function(e) {
                    const items = e.target.result || [];
                    tbody.innerHTML = ""; 
                    if (items.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="3" style="padding:15px; text-align:center; color:red;">현재 브라우저 창고에 저장된 데이터가 0개입니다.</td></tr>`;
                        return;
                    }
                    items.forEach(item => {
                        const tr = document.createElement("tr");
                        let currentName = item.name || "무명자료";
                        let displayContent = `📞연락처: ${item.phone || '-'} | 👥인원: ${item.count || '-'} | ⏰시간: ${item.time || '-'} | 💳상태: ${item.status || '-'}`;
                        
                        const tdName = document.createElement("td");
                        tdName.style.padding = "10px"; tdName.style.fontWeight = "bold";
                        tdName.innerText = currentName;

                        const tdContent = document.createElement("td");
                        tdContent.style.padding = "10px"; tdContent.style.color = "#333";
                        tdContent.innerText = displayContent;

                        const tdAction = document.createElement("td");
                        tdAction.style.padding = "10px"; tdAction.style.textAlign = "center";
                        
                        const delBtn = document.createElement("button");
                        delBtn.innerText = "삭제";
                        delBtn.style.cssText = "padding:4px 8px; background-color:#f44336; color:white; border:none; border-radius:3px; cursor:pointer; font-size:12px;";
                        delBtn.onclick = function() {
                            if (confirm(`[${currentName}] 데이터를 로컬창고에서 삭제하시겠습니까?`)) {
                                idb.transaction(["reservations"], "readwrite").objectStore("reservations").delete(item.id).onsuccess = function() {
                                    alert("삭제 완료되었습니다.");
                                    viewIndexedDBData();
                                    checkDatabaseCount();
                                    localStorage.setItem("db_updated_signal", Date.now());
                                };
                            }
                        };
                        tdAction.appendChild(delBtn);

                        tr.appendChild(tdName);
                        tr.appendChild(tdContent);
                        tr.appendChild(tdAction);
                        tbody.appendChild(tr);
                    });
                };
            } catch (err) { console.error(err); }
        }
        document.getElementById("btn-view-db").addEventListener("click", viewIndexedDBData);

        // 🌐 1. 구글시트로 표준 규격 내보내기 (GAS 연동)
        async function exportAndOpenGoogleSheet() {
            if (!idb) return alert("데이터베이스가 연결되지 않았습니다.");
            try {
                const transaction = idb.transaction(["reservations"], "readonly");
                const store = transaction.objectStore("reservations");
                const request = store.getAll();
                request.onsuccess = function(e) {
                    const items = e.target.result || [];
                    if (items.length === 0) return alert("보낼 데이터가 없습니다.");
                    const parsedRows = items.map(item => {
                        return {
                            id: item.id ? String(item.id).trim() : "ID_" + Math.floor(Math.random() * 100000),
                            name: item.name ? String(item.name).trim() : "무명자료",
                            phone: item.phone ? String(item.phone).replace(/[^0-9]/g, '') : "",
                            count: item.count ? String(item.count).trim() : "1명",
                            time: item.time ? String(item.time).trim() : "",
                            status: item.status ? String(item.status).trim() : "대기",
                            createdAt: item.createdAt ? String(item.createdAt).substring(0, 10) : new Date().toISOString().substring(0, 10)
                        };
                    });
                    const openBtn = document.getElementById("btn-google-open");
                    openBtn.innerText = "⏳ 구글 시트 생성 및 이동 중...";
                    openBtn.disabled = true;

                    fetch(googleScriptUrl, {
                        method: "POST",
                        headers: { "Content-Type": "text/plain;charset=utf-8" },
                        body: JSON.stringify({ action: "createGoogleSheet", csvData: parsedRows })
                    })
                    .then(res => res.json())
                    .then(resultJson => {
                        if (resultJson.success && resultJson.sheetUrl) {
                            alert("✅ 표준 규격 구글 시트 생성이 완료되었습니다! 새 창에서 시트를 엽니다.");
                            window.open(resultJson.sheetUrl, "_blank");
                        } else { alert("구글 시트 생성 실패: " + JSON.stringify(resultJson)); }
                    })
                    .catch(err => alert("전송 에러: " + err.message))
                    .finally(() => {
                        openBtn.innerText = "🌐 구글시트로 표준 규격 내보내기";
                        openBtn.disabled = false;
                    });
                };
            } catch (err) { alert("창고 접근 실패: " + err.message); }
        }
        document.getElementById("btn-google-open").addEventListener("click", exportAndOpenGoogleSheet);

        // 📥 2. 구글시트 주소로부터 데이터를 덤프 받아와 로컬창고 복원
        async function importGoogleSheetToProgram() {
            const sheetUrl = document.getElementById("input-sheet-url").value.trim();
            if (!sheetUrl) return alert("구글 스프레드시트의 전체 주소(URL)를 입력해주세요.");
            if (!idb) return alert("데이터베이스 창고 연결을 확인할 수 없습니다.");
            
            if (!confirm("🚨 경고: 복원 시작 전 현재 창고(IndexedDB)의 기존 데이터를 완전히 싹 비우고, 구글 시트 장부 데이터로 새롭게 다시 채웁니다. 진행하시겠습니까?")) return;

            const importBtn = document.getElementById("btn-import-sheet");
            try {
                importBtn.innerText = "⏳ 창고 비우기 및 데이터 주입 중...";
                importBtn.disabled = true;

                const response = await fetch(googleScriptUrl, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "importFromGoogleSheet", sheetUrl: sheetUrl })
                });

                const resultJson = JSON.parse(await response.text());
                if (!resultJson.success || !resultJson.data) throw new Error(resultJson.message || "데이터 확인 실패");

                const transaction = idb.transaction(["reservations"], "readwrite");
                const store = transaction.objectStore("reservations");

                const clearRequest = store.clear();
                
                clearRequest.onsuccess = function() {
                    let importCount = 0;

                    // 📥 [수정본] 구글시트에서 데이터를 가져와 IndexedDB 규격에 완벽히 맞춰 주입하는 로직
resultJson.data.forEach(row => {
    // 1. 데이터 원본 위치 확보 (중첩 구조 해제)
    let source = (row.content && typeof row.content === 'object') ? row.content : row;
    
    // 2. 관리자 메뉴와 창고 Key 규격이 요구하는 ID 추출 (문자열 강제 변환 및 공백 제거)
    let fId = source.id || source.Id || row.id || "";
    fId = String(fId).trim();
    
    // 만약 ID가 누락되었다면 고유한 대체 ID 발급하여 누락 방지
    if (!fId || fId === "undefined") {
        fId = "ID_" + Math.floor(Math.random() * 1000000);
    }
    
    let fName = source.name || source.Name || source["이름"] || "";
    let fTime = source.time || source.Time || source["시간"] || "";
    
    if (!fName || !fTime) return; // 필수 예약자명이나 시간이 없으면 유효하지 않으므로 스킵

    let numericCount = parseInt(String(source.count || "1").replace(/[^0-9]/g, '')) || 1;
    let fCreatedAt = fTime.length >= 10 ? fTime.substring(0, 10) : new Date().toISOString().substring(0, 10);

    // 🎯 [핵심 수정] admin.html이 헷갈리지 않게 루트(최상위) 경로에 모든 데이터 필드를 바인딩합니다.
    const verifiedObject = {
        id: fId,                                      // Key Path인 "id"와 완벽 매칭
        name: String(fName).trim(),
        phone: String(source.phone || "").replace(/[^0-9]/g, ''), // 숫자만 추출
        count: numericCount + "명",
        numericCount: numericCount,
        time: String(fTime).trim(),
        status: String(source.status || "대기").trim(),
        createdAt: fCreatedAt
    };
    
    // IndexedDB에 주입 (기존에 꼬여있던 복잡한 중첩 구조 탈피)
    store.put(verifiedObject);
    importCount++;
});

                    transaction.oncomplete = function() {
                        alert(`🎉 기존 데이터 청소 완료 및 새 데이터 ${importCount}건 복원 성공!\n\n이제 조회 화면(admin.html)으로 돌아가시면 데이터가 실시간 갱신되어 있습니다.`);
                        document.getElementById("input-sheet-url").value = "";
                        
                        // 크로스 탭 알림 신호 전달 (admin.html 자동 새로고침 트리거)
                        localStorage.setItem("db_updated_signal", Date.now());
                        
                        viewIndexedDBData();
                        checkDatabaseCount();
                    };
                };

                clearRequest.onerror = function(e) {
                    throw new Error("창고를 비우는 중 오류가 발생했습니다: " + e.target.error.message);
                };

            } catch (error) { 
                alert("오류: " + error.message); 
            } finally {
                importBtn.innerText = "🔄 자료 구조 검증 후 복원";
                importBtn.disabled = false;
            }
        }
        document.getElementById("btn-import-sheet").addEventListener("click", importGoogleSheetToProgram);
    </script>
</body>
</html>
