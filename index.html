<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알지골프 - 실시간 예약 시스템</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="booking-container">
        <header>
            <h1>RG GOLF</h1>
            <p>경산시 용암동 알지골프 스크린</p>
        </header>

        <section class="booking-form">
            <div class="input-group">
                <label for="userName">예약자 성함</label>
                <input type="text" id="userName" placeholder="성함을 입력하세요" required>
            </div>
            <div class="input-group">
                <label for="userPhone">연락처</label>
                <input type="tel" id="userPhone" placeholder="010-0000-0000" required>
            </div>
            <div class="input-group">
                <label for="userCount">예약 인원 (명)</label>
                <!-- 사용자가 인원을 직접 입력할 수 있도록 숫자 필드로 변경 -->
                <input type="number" id="userCount" min="1" max="20" value="2" required>
            </div>
            <div class="input-group">
                <label for="bookingTime">예약 일시</label>
                <input type="datetime-local" id="bookingTime" required>
            </div>
            <button type="button" onclick="handleBooking()" class="btn-primary">예약 신청 및 문자전송</button>
            <a href="tel:01035028232" class="btn-tel">매장으로 전화 걸기</a>
            <a href="admin.html" class="btn-admin-link">📢 관리자 페이지 이동</a>
        </section>

        <footer>
            <p>© 2026 RG GOLF. All rights reserved.</p>
        </footer>
    </div>

    <!-- 모달 팝업 (입금 및 확인 안내) -->
    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>예약 신청 확인</h3>
            </div>
            <div class="modal-body">
                <p class="status-msg">신청이 접수되었습니다.<br>확정을 위해 입금해 주시거나<br>아래 버튼을 눌러 문자를 발송해주세요.</p>
                
                <div class="account-box">
                    <span class="bank-label">카카오뱅크</span>
                    <strong id="accountNum">7942-25-80482</strong>
                    <span class="account-holder">예금주: 한용섭</span>
                </div>
                
                <div class="price-info">
                    <span>이용 금액(기본):</span>
                    <strong class="price">20,000원</strong>
                </div>

                <div class="button-group">
                    <button onclick="copyAccount()" class="btn-action copy">계좌복사 후 문자발송</button>
                    <button onclick="handleLaterPay()" class="btn-action later">나중에 입금 (현장결제)</button>
                    <button onclick="closeModal()" class="btn-action close">창 닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
