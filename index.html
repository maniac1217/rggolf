<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>알지골프 - 실시간 예약 시스템</title>
    <link rel="stylesheet" href="style.css?v=20260714">
</head>
<body>
    <div class="booking-container">
        <header>
            <h1>RG GOLF</h1>
            <p>경산시 용암동 알지골프 스크린</p>
        </header>

        <section class="booking-form">
            <div class="input-group">
                <label for="userName">예약자 성함</label>
                <input type="text" id="userName" placeholder="성함을 입력하세요" required>
            </div>
            <div class="input-group">
                <label for="userPhone">연락처</label>
                <input type="tel" id="userPhone" placeholder="010-0000-0000" required>
            </div>
            <div class="input-group">
                <label for="userCount">예약 인원 (명)</label>
                <input type="number" id="userCount" min="1" max="20" value="2" required>
            </div>
            <div class="input-group">
                <label for="bookingTime">예약 일시</label>
                <input type="datetime-local" id="bookingTime" required>
            </div>
            
            <div class="button-group">
                <button type="button" onclick="handleBooking()" class="btn-primary" style="width:100%; padding:15px; font-size:16px; font-weight:bold; cursor:pointer;">
                    예약 신청 (문자 전송 및 저장)
                </button>
            </div>

            <div class="account-box" style="margin-top:20px; background:#f7f7f7; padding:15px; border-radius:8px; border:1px solid #ddd; text-align:center;">
                <span class="bank-label" style="display:block; font-size:12px; color:#666;">카카오뱅크</span>
                <strong id="accountNum" style="font-size:18px; color:#222;">7942-25-80482</strong><br>
                <span class="account-holder" style="font-size:13px; color:#444;">예금주: 한용섭</span>
            </div>

            <a id="hiddenTelLink" href="tel:0538178800" style="display:none;"></a>
            
            <br>
            <a href="admin.html" class="btn-admin-link">📢 관리자 페이지 이동</a>
        </section>

        <footer>
            <p>© 2026 RG GOLF. All rights reserved.</p>
        </footer>
    </div>

    <!-- 모달 창 -->
    <div id="modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin-top:0;">예약 신청 확인</h3>
            </div>
            <div class="modal-body">
                <p class="status-msg">신청이 접수되었습니다.<br>확정을 위해 입금해 주시거나<br>아래 버튼을 눌러 문자를 발송해주세요.</p>
                
                <div class="account-box">
                    <span class="bank-label" style="display:block; font-size:12px; color:#666;">카카오뱅크</span>
                    <strong style="font-size:18px; color:#222;">7942-25-80482</strong><br>
                    <span class="account-holder" style="font-size:13px; color:#444;">예금주: 한용섭</span>
                </div>
                
                <div class="price-info">
                    <span>이용 금액(기본):</span>
                    <strong class="price">20,000원</strong>
                </div>

                <div class="button-group">
                    <button onclick="copyAccount()" class="btn-action copy">사전입금 및 문자발송</button>
                    <button onclick="handleLaterPay()" class="btn-action later">나중에 입금 (사후결제)</button>
                    <button onclick="closeModal()" class="btn-action close">창 닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js?v=20260714"></script>
</body>
</html>
