<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알지골프 - 관리자 시스템</title>
    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; background: #f5f6fa; margin: 0; padding: 15px; }
        .admin-wrap { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #2c3e50; font-size: 1.4rem; text-align: center; margin-bottom: 20px; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
        
        #loginBox { text-align: center; padding: 40px 20px; }
        #loginBox input { padding: 12px; font-size: 1.1rem; width: 80%; max-width: 200px; border-radius: 8px; border: 1px solid #ddd; text-align: center; margin-bottom: 15px; }
        #loginBox button { background: #27ae60; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        #mainDashboard { display: none; }
        .filter-box { background: #edf2f7; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .date-inputs { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
        .date-inputs label { font-size: 0.85rem; font-weight: bold; color: #4a5568; }
        input[type="date"], input[type="text"], input[type="tel"], select { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.9rem; box-sizing: border-box; }
        input[type="date"] { width: 42%; }
        .btn-search { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        
        /* 수동 입력 폼 스타일 */
        .insert-box { background: #e8f4fd; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #bee3f8; }
        .insert-box h3 { margin: 0 0 5px 0; font-size: 1rem; color: #2b6cb0; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .form-grid input, .form-grid select { width: 100%; }
        .btn-insert { background: #2b6cb0; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95rem; }

        /* 건수 및 인원 합계 */
        .counter-box { display: flex; justify-content: space-between; background: #f8f9fa; padding: 12px 15px; border-radius: 8px; margin: 10px 0; font-size: 0.95rem; border: 1px dashed #cbd5e0; }
        .counter-item { font-weight: bold; color: #2d3748; }
        .counter-item span { color: #e53e3e; font-size: 1.05rem; }
        .counter-item .total-people { color: #2b6cb0; font-size: 1.05rem; }
        
        .card-list { display: flex; flex-direction: column; gap: 12px; }
        .card { background: #fff; border: 1px solid #e1e8ed; padding: 15px; border-radius: 10px; }
        .card-header { display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #f1f2f6; padding-bottom: 8px; margin-bottom: 8px; }
        .card-time { color: #27ae60; }
        .card-body p { margin: 8px 0; font-size: 0.95rem; }
        
        .controls { display: flex; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #edf2f7; flex-wrap: wrap; }
        .btn-edit { background: #3498db; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .btn-sms { background: #f39c12; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; margin-left: auto; }
        
        .btn-back { display: block; text-align: center; margin-top: 25px; color: #95a5a6; text-decoration: none; }
        
        /* 기능 추가 버튼 스타일 */
        .btn-excel { background: #1f7246; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; width: 100%; margin-bottom: 15px; }
        .btn-link { background: #7f8c8d; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; width: 100%; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="admin-wrap">
    <div id="loginBox">
        <h2>관리자 비밀번호 입력</h2>
        <input type="password" id="adminPassword" placeholder="암호 4자리 입력" maxlength="4">
        <br>
        <button onclick="checkPassword()">로그인</button>
    </div>

    <div id="mainDashboard">
        <h1>알지골프 예약 정보 관리</h1>
        
        <div class="insert-box">
            <h3>➕ 누락 예약 자료 수동 입력</h3>
            <div class="form-grid">
                <input type="text" id="insName" placeholder="예약자명">
                <input type="tel" id="insPhone" placeholder="연락처 (숫자만)">
                <input type="text" id="insTime" placeholder="예약시간 (예: 14:30)">
                <input type="text" id="insCount" placeholder="인원수 (예: 4)">
                <select id="insStatus">
                    <option value="대기중">대기중</option>
                    <option value="예약확정">예약확정</option>
                    <option value="미입금">미입금</option>
                    <option value="취소건">취소건</option>
                </select>
                <input type="date" id="insDate" style="width:100%;">
            </div>
            <button onclick="insertReservationToFirebase()" class="btn-insert">데이터베이스에 즉시 추가</button>
        </div>

        <div class="filter-box">
            <div class="date-inputs">
                <label>시작</label>
                <input type="date" id="startDate">
                <label>종료</label>
                <input type="date" id="endDate">
            </div>
            <button onclick="fetchData()" class="btn-search">기간 설정 조회</button>
        </div>

        <div class="counter-box">
            <div class="counter-item">조회 건수: <span id="totalCount">0</span>건</div>
            <div class="counter-item">총 인원 합계: <span id="totalPeople" class="total-people">0</span>명</div>
        </div>

        <button onclick="exportToExcel()" class="btn-excel">📊 현재 조회된 내역 엑셀(구글시트) 내보내기</button>

        <div class="card-list" id="dataList"></div>
        
        <button onclick="location.href='firebase_link.html'" class="btn-link">🔥 연동 프로그램 켜기</button>
        <a href="index.html" class="btn-back">⬅ 메인 예약화면으로 돌아가기</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set, get, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBwm5KpbfxaeQnyKm0MVsJH1ifyJzmnNRM",
        authDomain: "rg-golf.firebaseapp.com",
        databaseURL: "https://rg-golf-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "rg-golf",
        storageBucket: "rg-golf.firebasestorage.app",
        messagingSenderId: "382686211001",
        appId: "1:382686211001:web:9c0dfba9c93b7966c9a468",
        measurementId: "G-WT14V4N0EX"
    };

    const app = initializeApp(firebaseConfig);
    const firebaseDb = getDatabase(app);

    let currentFetchedData = []; // 현재 화면에 표시중인 데이터 저장용 변수
    const BANK_ACCOUNT = "카카오뱅크 7942-25-80482 (예금주: 한용섭)";

    window.checkPassword = function() {
        const inputPw = document.getElementById('adminPassword').value;
        if (inputPw === "1806") {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('mainDashboard').style.display = 'block';
            initDates();
            fetchData(); // 파이어베이스에서 실시간 직접 조회
        } else {
            alert("암호가 일치하지 않습니다.");
            document.getElementById('adminPassword').value = "";
        }
    };

    // 창고 업데이트 이벤트 발생 시 자동 동기화
    window.addEventListener("storage", (event) => {
        if (event.key === "db_updated_signal") {
            console.log("🔄 데이터 동기화 신호 감지 -> 화면 갱신");
            fetchData();
        }
    });

    function initDates() {
        const today = new Date();
        const oneMonthAgo = new Date();
        oneMonthAgo.setMonth(today.getMonth() - 1);

        document.getElementById('endDate').valueAsDate = today;
        document.getElementById('startDate').valueAsDate = oneMonthAgo;
        document.getElementById('insDate').valueAsDate = today; 
    }

    // 📡 구글 파이어베이스 서버에서 직접 데이터를 조회 및 필터링 (복원 에러 원천 차단)
    window.fetchData = async function() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;

        if (!start || !end) {
            alert("조회 시작일자와 종료일자를 모두 입력해주세요.");
            return;
        }

        try {
            const resRef = ref(firebaseDb, 'reservations');
            const snapshot = await get(resRef);
            
            if (!snapshot.exists()) {
                currentFetchedData = [];
                renderList([]);
                return;
            }

            const allData = [];
            snapshot.forEach((childSnapshot) => {
                const key = childSnapshot.key;
                const val = childSnapshot.val();
                
                // 시간 데이터에서 날짜 추출 처리 안전장치 (예: "2026-07-06 14:30" -> "2026-07-06")
                let targetDate = val.createdAt ? val.createdAt.substring(0, 10) : "";
                if(!targetDate && val.time) {
                    targetDate = val.time.substring(0, 10);
                }

                allData.push({
                    id: key, // 파이어베이스 고유 키 고정
                    name: val.name,
                    phone: val.phone,
                    time: val.time,
                    count: val.count,
                    status: val.status,
                    createdAt: targetDate
                });
            });

            // 선택한 기간에 맞는 데이터 필터링
            const filteredData = allData.filter(item => item.createdAt >= start && item.createdAt <= end);
            // 최신 시간순 정렬
            filteredData.sort((a, b) => new Date(b.time.replace(/-/g, '/')) - new Date(a.time.replace(/-/g, '/')));
            
            currentFetchedData = filteredData;
            renderList(filteredData);

        } catch (error) {
            console.error("데이터 조회 실패:", error);
            alert("서버에서 데이터를 가져오는 데 실패했습니다.");
        }
    };

    // 🌟 구글 파이어베이스 수동 저장 엔진
    window.insertReservationToFirebase = async function() {
        const name = document.getElementById('insName').value.trim();
        const phone = document.getElementById('insPhone').value.trim();
        const time = document.getElementById('insTime').value.trim();
        let count = document.getElementById('insCount').value.trim();
        const status = document.getElementById('insStatus').value;
        const dateVal = document.getElementById('insDate').value;

        if (!name || !phone || !time || !count || !dateVal) {
            alert("빈칸 없이 모든 예약 정보를 입력해주세요.");
            return;
        }

        if(!count.includes('명')) { count = count + "명"; }

        const newRecord = {
            name: name,
            phone: phone,
            time: `${dateVal} ${time}`,
            count: count,
            status: status,
            createdAt: dateVal
        };

        try {
            const reservationsRef = ref(firebaseDb, 'reservations');
            const newReservationRef = push(reservationsRef);
            await set(newReservationRef, newRecord);

            alert(`[${name}]님의 예약 자료를 구글 서버에 추가했습니다.`);
            
            document.getElementById('insName').value = "";
            document.getElementById('insPhone').value = "";
            document.getElementById('insTime').value = "";
            document.getElementById('insCount').value = "";
            fetchData(); 

        } catch (error) {
            alert("서버 전송 중 에러가 발생했습니다.");
        }
    };

    function renderList(data) {
        const container = document.getElementById('dataList');
        container.innerHTML = "";
        
        document.getElementById('totalCount').innerText = data.length;

        let totalPeopleSum = 0;
        data.forEach(item => {
            if(item.count) {
                const num = parseInt(item.count.toString().replace(/[^0-9]/g, ""), 10);
                if(!isNaN(num)) { totalPeopleSum += num; }
            }
        });
        document.getElementById('totalPeople').innerText = totalPeopleSum;

        if(data.length === 0) {
            container.innerHTML = "<p style='text-align:center;color:#95a5a6;padding:30px;'>선택하신 기간 내 예약 내역이 없습니다.</p>";
            return;
        }

        data.forEach(item => {
            const cardHtml = `
                <div class="card" id="card-${item.id}">
                    <div class="card-header">
                        <span class="card-time">⏰ ${item.time}</span>
                        <span id="status-text-${item.id}" style="font-weight:bold; color:#2c3e50;">[${item.status}]</span>
                    </div>
                    <div class="card-body">
                        <p><strong>예약자:</strong> ${item.name}</p>
                        <p><strong>인원수:</strong> <span id="count-text-${item.id}">${item.count}</span></p>
                        <p><strong>연락처:</strong> <a href="tel:${item.phone}" style="color:#2980b9; text-decoration:none;">${item.phone}</a></p>
                        
                        <div class="controls">
                            <button onclick="updateReservation('${item.id}')" class="btn-edit">✏️ 정보수정</button>
                            <button onclick="sendUnpaidSms('${item.name}', '${item.phone}')" class="btn-sms">💬 미입금 안내</button>
                            <button onclick="deleteReservation('${item.id}')" class="btn-delete">🗑️ 삭제</button>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += cardHtml;
        });
    }

    // 📊 구글시트/엑셀 가져가기용 CSV 파일 내보내기 엔진 (클릭 즉시 다운로드)
    window.exportToExcel = function() {
        if (currentFetchedData.length === 0) {
            alert("내보낼 데이터가 없습니다. 먼저 기간 설정을 통해 데이터를 조회해 주세요.");
            return;
        }

        let csvContent = "\uFEFF"; // 한글 깨짐 방지용 BOM 코드
        csvContent += "예약일시,상태,예약자명,인원수,연락처\n";

        currentFetchedData.forEach(item => {
            const row = [
                `"${item.time}"`,
                `"${item.status}"`,
                `"${item.name}"`,
                `"${item.count}"`,
                `"${item.phone}"`
            ].join(",");
            csvContent += row + "\n";
        });

        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        
        link.setAttribute("href", url);
        link.setAttribute("download", `알지골프_예약리스트_${start}_to_${end}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    };

    window.sendUnpaidSms = function(name, phone) {
        const message = `[알지골프] 안녕하세요 ${name}님, 예약 건에 대해 입금이 확인 안 되니 확인해 주시기 바랍니다. \n■ 입금계좌: ${BANK_ACCOUNT}`;
        const encodedMsg = encodeURIComponent(message);
        let smsUrl = `sms:${phone}?body=${encodedMsg}`;
        if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
            smsUrl = `sms:${phone}&body=${encodedMsg}`;
        }
        navigator.clipboard.writeText(message).then(() => {
            alert("미입금 안내 문자가 클립보드에 자동 복사되었습니다!\n문자창이 열리면 붙여넣기 하실 수 있습니다.");
            window.location.href = smsUrl; 
        }).catch(() => {
            window.location.href = smsUrl;
        });
    };

    window.updateReservation = async function(id) {
        try {
            const resRef = ref(firebaseDb, `reservations/${id}`);
            const snapshot = await get(resRef);
            if (!snapshot.exists()) return;

            const data = snapshot.val();
            let newCount = prompt("변경할 예약 인원수를 입력하세요:", data.count);
            if (newCount === null) return; 
            if (newCount.trim() !== "" && !newCount.includes('명')) {
                newCount = newCount.trim() + "명";
            }
            const newStatus = prompt("변경할 접수 상태를 입력하세요:", data.status);
            if (newStatus === null) return;

            data.count = newCount;
            data.status = newStatus;

            await set(resRef, data);
            alert("구글 서버에 예약 정보가 정상적으로 수정되었습니다.");
            fetchData(); 
        } catch (e) {
            alert("수정 중 오류가 발생했습니다.");
        }
    };

    window.deleteReservation = async function(id) {
        if (confirm("정말로 해당 예약 내역을 구글 서버에서 영구 삭제하시겠습니까?")) {
            try {
                const resRef = ref(firebaseDb, `reservations/${id}`);
                await remove(resRef);
                alert("해당 예약 데이터가 정상 삭제되었습니다.");
                fetchData(); 
            } catch(e) {
                alert("삭제 중 오류가 발생했습니다.");
            }
        }
    };
</script>
</body>
</html>
