<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>알지골프 - 구글시트 관리자 시스템</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            background: #f5f6fa; 
            margin: 0; 
            padding: 10px; 
            color: #2c3e50;
        }
        .admin-wrap { 
            max-width: 500px; 
            margin: 0 auto; 
            background: white; 
            padding: 16px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        h1 { 
            color: #2c3e50; 
            font-size: 1.25rem; 
            text-align: center; 
            margin: 10px 0 20px 0; 
            border-bottom: 2px solid #27ae60; 
            padding-bottom: 10px; 
        }
        
        #loginBox { text-align: center; padding: 30px 10px; }
        #loginBox h2 { font-size: 1.2rem; margin-bottom: 15px; }
        #loginBox input { 
            padding: 14px; 
            font-size: 1.1rem; 
            width: 100%; 
            max-width: 240px; 
            border-radius: 10px; 
            border: 1px solid #cbd5e0; 
            text-align: center; 
            margin-bottom: 15px; 
        }
        #loginBox button { 
            background: #27ae60; 
            color: white; 
            border: none; 
            padding: 14px; 
            width: 100%;
            max-width: 240px;
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 1rem;
            cursor: pointer; 
        }
        
        #mainDashboard { display: none; }
        
        .insert-box { 
            background: #e8f4fd; 
            padding: 14px; 
            border-radius: 12px; 
            margin-bottom: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            border: 1px solid #bee3f8; 
        }
        .insert-box h3 { margin: 0 0 5px 0; font-size: 0.95rem; color: #2b6cb0; }
        .form-grid { display: flex; flex-direction: column; gap: 8px; }
        .form-row { display: flex; gap: 8px; }
        .form-row input, .form-row select { flex: 1; min-width: 0; }
        
        input[type="date"], input[type="text"], input[type="tel"], select { 
            width: 100%;
            padding: 12px; 
            border: 1px solid #cbd5e0; 
            border-radius: 8px; 
            font-size: 0.9rem; 
            background-color: #fff;
            -webkit-appearance: none;
        }

        .btn-insert { 
            background: #2b6cb0; 
            color: white; 
            border: none; 
            padding: 14px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 0.95rem; 
            margin-top: 4px;
        }

        .settlement-box { background: #fff3cd; padding: 14px; border-radius: 12px; margin-bottom: 15px; border-left: 4px solid #ffc107; }
        .settlement-box h3 { margin: 0 0 10px 0; font-size: 0.95rem; color: #856404; }
        .settlement-controls { display: flex; gap: 8px; }
        .btn-settlement { flex: 1; background: #28a745; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .last-settlement-info { background: #f0f0f0; padding: 8px 10px; border-radius: 6px; margin-top: 8px; font-size: 0.8rem; color: #333; }

        .filter-box { background: #edf2f7; padding: 14px; border-radius: 12px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .date-inputs { display: flex; align-items: center; gap: 6px; }
        .date-inputs label { font-size: 0.8rem; font-weight: bold; color: #4a5568; white-space: nowrap; }
        .date-inputs input[type="date"] { flex: 1; padding: 10px; font-size: 0.85rem; }
        
        .btn-search { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95rem; width: 100%; }
        
        .counter-box { display: flex; justify-content: space-between; background: #f8f9fa; padding: 10px 12px; border-radius: 8px; margin: 10px 0; font-size: 0.85rem; border: 1px dashed #cbd5e0; }
        .counter-item { font-weight: bold; color: #2d3748; }
        .counter-item span { color: #e53e3e; font-size: 1rem; }
        .counter-item .total-people { color: #2b6cb0; font-size: 1rem; }
        
        .card-list { display: flex; flex-direction: column; gap: 10px; }
        .card { background: #fff; border: 1px solid #e1e8ed; padding: 12px 14px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .card.settled { border-left: 4px solid #28a745; background: #f0fdf4; }
        .card-header { display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid #f1f2f6; padding-bottom: 6px; margin-bottom: 6px; font-size: 0.9rem; }
        .card-time { color: #27ae60; }
        .card-body p { margin: 6px 0; font-size: 0.88rem; }
        
        .controls { display: flex; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #edf2f7; }
        .btn-sms { background: #f39c12; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; width: 100%; }
        
        .btn-back { display: block; text-align: center; margin-top: 20px; color: #95a5a6; text-decoration: none; font-size: 0.85rem; padding: 10px; }
        .btn-excel { background: #1f7246; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; width: 100%; margin-bottom: 12px; }
        .btn-sheet-view { background: #4285F4; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; width: 100%; margin-bottom: 12px; }
        
        .settlement-records-box { background: #f8f9fa; padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #dee2e6; }
        .settlement-records-box h3 { margin: 0 0 8px 0; font-size: 0.9rem; color: #343a40; }
        .settlement-record-card { background: white; border: 1px solid #dee2e6; border-left: 4px solid #28a745; border-radius: 8px; padding: 10px; margin-bottom: 6px; font-size: 0.8rem; }
        .sr-row { display: flex; justify-content: space-between; margin-bottom: 4px; align-items: center; }
        .sr-label { color: #666; }
        .sr-value { font-weight: bold; color: #2d3748; }
    </style>
</head>
<body>

<div class="admin-wrap">
    <!-- 로그인 박스 -->
    <div id="loginBox">
        <h2>관리자 암호 입력</h2>
        <input type="password" id="adminPassword" placeholder="비밀번호 4자리" maxlength="4" pattern="\d*">
        <br>
        <button onclick="checkPassword()">로그인</button>
    </div>

    <!-- 대시보드 메인 -->
    <div id="mainDashboard">
        <h1>알지골프 예약 관리자</h1>
        
        <!-- 수동 데이터 추가 입력 -->
        <div class="insert-box">
            <h3>➕ 누락 예약 수동 등록 (구글시트 저장)</h3>
            <div class="form-grid">
                <div class="form-row">
                    <input type="text" id="insName" placeholder="예약자명">
                    <input type="tel" id="insPhone" placeholder="연락처(숫자만)">
                </div>
                <div class="form-row">
                    <input type="date" id="insDate">
                    <input type="text" id="insTime" placeholder="시간 (예: 14:30)">
                </div>
                <div class="form-row">
                    <input type="text" id="insCount" placeholder="인원수 (예: 4)">
                    <select id="insStatus">
                        <option value="대기중">대기중</option>
                        <option value="예약확정">예약확정</option>
                        <option value="미입금">미입금</option>
                        <option value="취소건">취소건</option>
                        <option value="정산완료">정산완료</option>
                    </select>
                </div>
            </div>
            <button onclick="insertReservationToSheet()" id="btnInsertSubmit" class="btn-insert">구글 시트에 즉시 저장</button>
        </div>

        <!-- 정산 관리 -->
        <div class="settlement-box">
            <h3>💰 게임비 정산 관리</h3>
            <div class="settlement-controls">
                <button onclick="openSettlementModal()" class="btn-settlement">📋 정산완료 기록</button>
                <button onclick="resetSettlementDate()" class="btn-settlement" style="background: #dc3545;">🔄 초기화</button>
            </div>
            <div id="settlementInfo" class="last-settlement-info">
                최근 정산: <span id="lastSettlementDate" style="font-weight: bold; color: #28a745;">기록 없음</span>
            </div>
        </div>

        <!-- 정산 내역 -->
        <div class="settlement-records-box">
            <h3>📑 최근 정산 내역</h3>
            <div id="settlementRecordsList"><p style="text-align:center;color:#95a5a6;padding:10px;">기록 없음</p></div>
        </div>

        <!-- 데이터 검색 및 조회 -->
        <div class="filter-box">
            <div class="date-inputs">
                <label>시작</label>
                <input type="date" id="startDate">
                <label>종료</label>
                <input type="date" id="endDate">
            </div>
            <button onclick="fetchData()" class="btn-search">🔍 구글시트 조회</button>
            <button onclick="fetchDataAfterSettlement()" class="btn-search" style="background: #17a2b8;">📊 최근 정산 이후 조회</button>
        </div>

        <!-- 카운터 표시 -->
        <div class="counter-box">
            <div class="counter-item">조회 건수: <span id="totalCount">0</span>건</div>
            <div class="counter-item">총 인원: <span id="totalPeople" class="total-people">0</span>명</div>
        </div>

        <button onclick="openGoogleSheet()" class="btn-sheet-view">📊 구글시트 보기</button>
        <button onclick="exportToExcel()" class="btn-excel">📥 현재 조회 목록 CSV 다운로드</button>

        <!-- 예약 카드 목록 -->
        <div class="card-list" id="dataList"></div>
        
        <a href="index.html" class="btn-back">⬅ 메인 예약화면 이동</a>
    </div>
</div>

<script>
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxbvm2m3U9F1gmSee8gg-BMuApUDta1pLUoVQt9V6h0MipamOkPh71gqMQWCPGjqzF7bA/exec";
    // 구글 스프레드시트 원본 보기 주소 (필요시 실제 시트 주소로 교체 가능)
    const GOOGLE_SHEET_VIEW_URL = "https://docs.google.com/spreadsheets/d/1EEnOkCE1tUsroIRGY7UiQly93b0YA7Cn5YBELaGt5Z0/edit?gid=0#gid=0/";
    
    let currentFetchedData = []; 
    let cachedSheetData = []; 
    const BANK_ACCOUNT = "카카오뱅크 7942-25-80482 (예금주: 한용섭)";
    const SETTLEMENT_KEY = "lastSettlementDate";
    const SETTLEMENT_RECORDS_KEY = "settlementRecords";

    function getLocalDateStr(date) {
        const d = date || new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    }

    function checkPassword() {
        const inputPw = document.getElementById('adminPassword').value;
        if (inputPw === "1806") {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('mainDashboard').style.display = 'block';
            initDates();
            displayLastSettlementDate();
            displaySettlementRecords();
            fetchData(); 
        } else {
            alert("암호가 일치하지 않습니다.");
            document.getElementById('adminPassword').value = "";
        }
    }

    function initDates() {
        const today = new Date();
        const oneMonthAgo = new Date();
        oneMonthAgo.setMonth(today.getMonth() - 1);

        document.getElementById('endDate').valueAsDate = today;
        document.getElementById('startDate').valueAsDate = oneMonthAgo;
        document.getElementById('insDate').valueAsDate = today; 
    }

    function fetchData() {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;

        if (!start || !end) {
            alert("조회 날짜를 선택해주세요.");
            return;
        }

        const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
        
        window[callbackName] = function(data) {
            delete window[callbackName];
            const scriptEl = document.getElementById(callbackName);
            if (scriptEl) scriptEl.remove();

            try {
                cachedSheetData = Array.isArray(data) ? data : [];
                processAndRenderData(start, end, cachedSheetData);
            } catch (error) {
                console.error("데이터 파싱 실패:", error);
                alert("데이터 분석 중 오류가 발생했습니다.");
            }
        };

        const script = document.createElement('script');
        script.id = callbackName;
        script.src = `${GOOGLE_SHEET_URL}?callback=${callbackName}&_=${Date.now()}`;
        script.onerror = function() {
            delete window[callbackName];
            script.remove();
            alert("구글시트 데이터를 불러오지 못했습니다. GAS 배포 상태를 확인해주세요.");
        };

        document.body.appendChild(script);
    }

    function processAndRenderData(start, end, rawData) {
        const parsedData = rawData.map(item => {
            let name = item.name || item.Name || item["예약자명"] || item["이름"] || "무명";
            let phone = item.phone || item.Phone || item["연락처"] || item["전화번호"] || "-";
            let timeStr = item.time || item.Time || item.createdAt || item["시간"] || "";
            let count = item.count || item.Count || item["인원수"] || item["인원"] || "1명";
            let status = item.status || item.Status || item["상태"] || "대기중";

            let datePart = "";
            if (timeStr) {
                let match = String(timeStr).match(/\d{4}-\d{2}-\d{2}/);
                datePart = match ? match[0] : (String(timeStr).substring(0, 10));
            }
            if (!datePart || datePart.length < 10) {
                datePart = item.createdAt ? String(item.createdAt).substring(0, 10) : getLocalDateStr();
            }

            return {
                name: name,
                phone: phone,
                time: timeStr || datePart,
                count: count,
                status: status,
                createdAt: datePart
            };
        });

        const filteredData = parsedData.filter(item => item.createdAt >= start && item.createdAt <= end);
        filteredData.sort((a, b) => new Date(String(b.time).replace(/-/g, '/')) - new Date(String(a.time).replace(/-/g, '/')));
        
        currentFetchedData = filteredData;
        renderList(filteredData);
    }

    async function insertReservationToSheet() {
        const name = document.getElementById('insName').value.trim();
        const phone = document.getElementById('insPhone').value.trim();
        const time = document.getElementById('insTime').value.trim();
        let count = document.getElementById('insCount').value.trim();
        const status = document.getElementById('insStatus').value;
        const dateVal = document.getElementById('insDate').value;

        if (!name || !phone || !time || !count || !dateVal) {
            alert("모든 빈칸 항목을 입력해주세요.");
            return;
        }

        if (!count.includes('명')) count = count + "명";

        const btn = document.getElementById('btnInsertSubmit');
        btn.disabled = true;
        btn.innerText = "전송 중...";

        const payload = {
            name: name,
            phone: phone.replace(/[^0-9]/g, ''),
            count: count,
            time: `${dateVal} ${time}`,
            status: status,
            createdAt: new Date().toISOString()
        };

        try {
            await fetch(GOOGLE_SHEET_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            alert(`[${name}]님 예약 자료 전송 완료!`);
            document.getElementById('insName').value = "";
            document.getElementById('insPhone').value = "";
            document.getElementById('insTime').value = "";
            document.getElementById('insCount').value = "";
            
            setTimeout(() => { fetchData(); }, 1000);
        } catch (error) {
            alert("구글 시트 전송 실패: " + error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "구글 시트에 즉시 저장";
        }
    }

    function renderList(data) {
        const container = document.getElementById('dataList');
        container.innerHTML = "";
        
        document.getElementById('totalCount').innerText = data.length;

        let totalPeopleSum = 0;
        data.forEach(item => {
            if (item.count) {
                const num = parseInt(item.count.toString().replace(/[^0-9]/g, ""), 10);
                if (!isNaN(num)) totalPeopleSum += num;
            }
        });
        document.getElementById('totalPeople').innerText = totalPeopleSum;

        if (data.length === 0) {
            container.innerHTML = "<p style='text-align:center;color:#95a5a6;padding:30px;font-size:0.9rem;'>조회 조건에 해당하는 내역이 없습니다.</p>";
            return;
        }

        data.forEach(item => {
            const isSettled = item.status === "정산완료";
            const cardClass = isSettled ? "card settled" : "card";
            const statusBadge = isSettled 
                ? `<span style="background:#28a745; color:white; padding:2px 6px; border-radius:4px; font-size:0.75rem;">✅ 정산완료</span>` 
                : `<span style="font-weight:bold; color:#2b6cb0;">[${item.status}]</span>`;
            
            container.innerHTML += `
                <div class="${cardClass}">
                    <div class="card-header">
                        <span class="card-time">⏰ ${item.time}</span>
                        ${statusBadge}
                    </div>
                    <div class="card-body">
                        <p><strong>예약자:</strong> ${item.name} (${item.count})</p>
                        <p><strong>연락처:</strong> <a href="tel:${item.phone}" style="color:#2980b9; text-decoration:none;">${item.phone}</a></p>
                        <div class="controls">
                            <button onclick="sendUnpaidSms('${item.name}', '${item.phone}')" class="btn-sms">💬 미입금 안내 문자 발송</button>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    function sendUnpaidSms(name, phone) {
        const message = `[알지골프] 안녕하세요 ${name}님, 예약 건에 대해 입금 확인 부탁드립니다.\n■ 계좌: ${BANK_ACCOUNT}`;
        window.location.href = `sms:${phone}?body=${encodeURIComponent(message)}`;
    }

    function openGoogleSheet() {
        window.open(GOOGLE_SHEET_VIEW_URL, '_blank');
    }

    function exportToExcel() {
        if (currentFetchedData.length === 0) {
            alert("다운로드할 데이터가 없습니다.");
            return;
        }

        let csvContent = "\uFEFF예약일시,상태,예약자명,인원수,연락처\n";
        currentFetchedData.forEach(item => {
            csvContent += `"${item.time}","${item.status}","${item.name}","${item.count}","${item.phone}"\n`;
        });

        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `알지골프_예약목록_${document.getElementById('startDate').value}_to_${document.getElementById('endDate').value}.csv`;
        link.click();
    }

    function displayLastSettlementDate() {
        const lastDate = localStorage.getItem(SETTLEMENT_KEY);
        const display = document.getElementById('lastSettlementDate');
        if (lastDate) {
            display.innerText = `${lastDate} 정산`;
            display.style.color = '#28a745';
        } else {
            display.innerText = '기록 없음';
            display.style.color = '#e53e3e';
        }
    }

    function displaySettlementRecords() {
        const records = JSON.parse(localStorage.getItem(SETTLEMENT_RECORDS_KEY) || "[]");
        const container = document.getElementById('settlementRecordsList');
        if (!container) return;

        if (records.length === 0) {
            container.innerHTML = '<p style="text-align:center;color:#95a5a6;padding:10px;font-size:0.8rem;">기록 없음</p>';
            return;
        }

        const reversed = [...records].reverse();
        container.innerHTML = reversed.map((r, i) => `
            <div class="settlement-record-card">
                <div class="sr-row"><span class="sr-label">기간</span><span class="sr-value">${r.startDate} ~ ${r.endDate}</span></div>
                <div class="sr-row"><span class="sr-label">인원/금액</span><span class="sr-value" style="color:#28a745;">${r.people}명 (${Number(r.amount).toLocaleString()}원)</span></div>
            </div>
        `).join('');
    }

    function resetSettlementDate() {
        if (confirm("정산 기록을 초기화하시겠습니까?")) {
            localStorage.removeItem(SETTLEMENT_KEY);
            localStorage.removeItem(SETTLEMENT_RECORDS_KEY);
            displayLastSettlementDate();
            displaySettlementRecords();
            fetchData();
        }
    }

    function fetchDataAfterSettlement() {
        const lastDate = localStorage.getItem(SETTLEMENT_KEY);
        if (!lastDate) {
            alert("정산 기록이 없습니다.");
            return;
        }
        document.getElementById('startDate').value = lastDate;
        document.getElementById('endDate').value = getLocalDateStr();
        fetchData();
    }
</script>
</body>
</html>
